    engine: bing
    shortcut: bi
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
  - name: wikipedia
    engine: wikipedia
    shortcut: wp
  - name: wikidata
    engine: wikidata
    shortcut: wd
  - name: github
    engine: github
    shortcut: gh
  - name: arxiv
    engine: arxiv
    shortcut: ar
