# SearXNG configuration for GrowForge Digital AI OS
#
# Copy this file to settings.yml (gitignored - never commit that copy) and
# replace secret_key with a real random value:
#   python3 -c "import secrets; print(secrets.token_hex(32))"
use_default_settings: true

server:
  secret_key: "REPLACE_WITH_A_REAL_RANDOM_64_CHAR_HEX_SECRET"
  bind_address: "127.0.0.1"
  port: 8088
  base_url: "http://localhost:8088/"

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "auto"
  formats:
    - html
    - json

engines:
  - name: google
    engine: google
    shortcut: go
  - name: bing
    engine: bing
    shortcut: bi
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
  - name: wikipedia
    engine: wikipedia
    shortcut: wp
  - name: wikidata
    engine: wikidata
    shortcut: wd
  - name: github
    engine: github
    shortcut: gh
  - name: arxiv
    engine: arxiv
    shortcut: ar
